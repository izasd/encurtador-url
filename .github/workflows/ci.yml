name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Um push novo na mesma branch cancela a execução anterior, que ficou desatualizada.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Testes de unidade
        run: dotnet test tests/Encurtador.Tests --no-build --configuration Release

      # O Testcontainers sobe um PostgreSQL de verdade no Docker do próprio runner.
      - name: Testes de integração (PostgreSQL)
        run: dotnet test tests/Encurtador.IntegrationTests --no-build --configuration Release

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npx ng test --watch=false

      - name: Build de produção
        run: npx ng build

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Construir a imagem
        run: docker build --tag encurtador .
