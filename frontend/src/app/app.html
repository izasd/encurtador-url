<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<header class="cabecalho">
  <div class="cabecalho-interno">
    <a class="logo" routerLink="/links">encurtador</a>

    @if (sessao.usuario(); as usuario) {
      <nav class="conta" aria-label="Conta">
        <span class="conta-nome">{{ usuario.nome }}</span>
        <button type="button" class="botao botao-secundario botao-pequeno" (click)="sair()">Sair</button>
      </nav>
    }
  </div>
</header>

<main id="conteudo" class="conteudo" tabindex="-1">
  <router-outlet />
</main>

<footer class="rodape">
  <p>Feito com ASP.NET Core, PostgreSQL e Angular.</p>
</footer>
