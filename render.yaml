# Blueprint do Render (https://render.com/docs/blueprint-spec): um serviço web gratuito que roda a
# imagem do Dockerfile, com a API e o site Angular. O PostgreSQL fica fora do Render, no Neon.
services:
  - type: web
    name: encurtador
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/saude
    # Só publica um commit depois que o GitHub Actions aprovar.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - Dockerfile
        - .dockerignore
        - backend/src/**
        - frontend/**
    envVars:
      # Endereço do banco no Neon (postgresql://...), informado ao criar o Blueprint.
      - key: ConnectionStrings__Encurtador
        sync: false
      # Segredo aleatório de 256 bits para assinar os tokens, gerado pelo próprio Render.
      - key: Jwt__Chave
        generateValue: true
      - key: Banco__AplicarMigracoesAoIniciar
        value: "true"
      # As requisições passam pelo Cloudflare e pelo proxy do Render antes de chegar à API.
      # O X-Forwarded-For chega como "visitante, Cloudflare, proxy interno", então o IP do
      # visitante é lido do cabeçalho que o Cloudflare preenche só com ele.
      - key: ProxyReverso__Habilitado
        value: "true"
      - key: ProxyReverso__CabecalhoDoIp
        value: CF-Connecting-IP
      # Porta em que a imagem do ASP.NET Core escuta.
      - key: PORT
        value: "8080"
