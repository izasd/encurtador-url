# Ambiente de desenvolvimento da v2.
# Por enquanto sobe só o PostgreSQL; a API e o frontend serão adicionados aqui depois.
#
#   docker compose up -d     # sobe o banco em segundo plano
#   docker compose down      # para o banco (os dados ficam no volume)
#   docker compose down -v   # para o banco e APAGA os dados
name: encurtador

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: encurtador
      POSTGRES_USER: encurtador
      POSTGRES_PASSWORD: encurtador # senha apenas para desenvolvimento local
    ports:
      # Porta 5433 no host para não conflitar com um PostgreSQL instalado na máquina (5432).
      - "5433:5432"
    volumes:
      # A partir do PostgreSQL 18 a imagem guarda os dados em /var/lib/postgresql/18/docker,
      # por isso o volume é montado em /var/lib/postgresql (e não em .../data).
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encurtador -d encurtador"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-dados:
