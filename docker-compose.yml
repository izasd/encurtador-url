# Aplicação completa: a API (que também serve o site Angular) e o PostgreSQL.
#
#   docker compose up --build    # constrói a imagem e sobe tudo: http://localhost:8080
#   docker compose down          # para tudo (os dados ficam no volume)
#   docker compose down -v       # para tudo e APAGA os dados
#
# Para desenvolver com dotnet run e ng serve, suba só o banco:
#
#   docker compose up -d db
name: encurtador

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: encurtador
      POSTGRES_USER: encurtador
      POSTGRES_PASSWORD: encurtador # senha apenas para desenvolvimento local
    ports:
      # Porta 5433 no host para não conflitar com um PostgreSQL instalado na máquina (5432).
      - "5433:5432"
    volumes:
      # A partir do PostgreSQL 18 a imagem guarda os dados em /var/lib/postgresql/18/docker,
      # por isso o volume é montado em /var/lib/postgresql (e não em .../data).
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encurtador -d encurtador"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      ConnectionStrings__Encurtador: Host=db;Database=encurtador;Username=encurtador;Password=encurtador
      # Chave apenas para uso local; em produção, use um segredo longo e aleatório.
      Jwt__Chave: ${JWT_CHAVE:-chave-local-do-docker-compose-troque-em-producao}
      # Cria ou atualiza as tabelas quando a API inicia.
      Banco__AplicarMigracoesAoIniciar: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-dados:
